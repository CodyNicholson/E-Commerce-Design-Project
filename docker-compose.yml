# MRO Mirror: Postgres + Go API + React web app.
#   docker network create tunnel-net   (once; the web container joins the Cloudflare tunnel network)
#   docker compose up -d --build       ->  http://localhost:8090
#   curl -X POST http://localhost:8090/api/admin/reset     (reload seed data)
name: mro-mirror

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-mro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mro-local-only}
      POSTGRES_DB: ${DB_NAME:-mro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mro} -d ${DB_NAME:-mro}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-mro}
      DB_PASSWORD: ${DB_PASSWORD:-mro-local-only}
      DB_NAME: ${DB_NAME:-mro}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Production build served by nginx on :80. The container name and tunnel-net match the
  # Cloudflare tunnel route (http://rixus-frontend:80), so pipeline-run.sh can publish it.
  web:
    build: ./frontend
    container_name: rixus-frontend
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - tunnel-net

volumes:
  pgdata:

networks:
  tunnel-net:
    external: true
