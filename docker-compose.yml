# MRO Mirror: Postgres + Spring Boot API + React web app.
#   cp .env.example .env and set DB_PASSWORD (pipeline-run.sh generates one on a new server)
#   docker network create tunnel-net   (once; the web container joins this external network)
#   docker compose up -d --build       ->  http://localhost:8090
# Networks: db is only on backend-net (internal, no route out), web is only on frontend-net and the
# external network, so the public-facing nginx container cannot reach Postgres directly.
name: mro-mirror

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-mro}
      # Required, no fallback: a missing .env must fail instead of starting with a known password
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-mro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mro} -d ${DB_NAME:-mro}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    networks:
      - backend-net

  api:
    build: ./backend
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-mro}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-mro}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
      # Empty switches POST /api/admin/reset off; set it to allow resets with X-Admin-Token
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 512
    cap_drop:
      - ALL
    networks:
      - backend-net
      - frontend-net

  # Production build served by unprivileged nginx on :80
  web:
    build: ./frontend
    container_name: rixus-frontend
    ports:
      # Localhost only: Docker's iptables rules bypass ufw, so a bare "8090:80" would be public
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    networks:
      - frontend-net
      - tunnel-net

volumes:
  pgdata:

networks:
  backend-net:
    internal: true
  frontend-net:
  tunnel-net:
    external: true
